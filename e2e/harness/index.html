<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wraith wallet — browser test harness</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <main>
      <h1>Wraith wallet</h1>

      <section aria-labelledby="wallet-heading">
        <h2 id="wallet-heading">Wallet</h2>
        <p>Status: <strong data-testid="wallet-status">Disconnected</strong></p>
        <p>Address: <code data-testid="wallet-address">—</code></p>
        <button type="button" data-testid="connect">Connect wallet</button>
        <button type="button" data-testid="disconnect">Disconnect</button>
      </section>

      <p role="alert" data-testid="error" hidden></p>

      <section data-testid="wallet-panel" aria-labelledby="receive-heading" hidden>
        <h2 id="receive-heading">Receive</h2>
        <p>Your address: <code data-testid="receive-address"></code></p>
        <button type="button" data-testid="copy-address">Copy address</button>
        <span role="status" data-testid="copy-status"></span>

        <h2>Send</h2>
        <p>Balance: <strong data-testid="balance">0.0000000</strong> XLM</p>
        <form data-testid="send-form">
          <label for="send-to">Destination</label>
          <input id="send-to" name="to" data-testid="send-to" autocomplete="off" required />
          <label for="send-amount">Amount</label>
          <input
            id="send-amount"
            name="amount"
            data-testid="send-amount"
            inputmode="decimal"
            autocomplete="off"
            required
          />
          <button type="submit" data-testid="send">Send</button>
        </form>
        <p role="status" data-testid="send-status"></p>

        <h2>Vault</h2>
        <p>Claimable: <strong data-testid="vault-claimable">—</strong> XLM</p>
        <p>Refundable: <strong data-testid="vault-refundable">—</strong> XLM</p>
        <button type="button" data-testid="vault-claim">Claim</button>
        <button type="button" data-testid="vault-refund">Refund</button>
        <p role="status" data-testid="vault-status"></p>

        <h2>Activity</h2>
        <ul data-testid="transfers"></ul>
      </section>
    </main>

    <script src="/__e2e__/wallet-provider.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
